<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse code — NaOS</title>
<meta name="description" content="Read the NaOS source in your browser. No download, no install.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0B0D'/%3E%3Crect x='5' y='5' width='22' height='22' fill='none' stroke='%23FFB224' stroke-width='2'/%3E%3Ctext x='9' y='22' font-family='monospace' font-size='12' fill='%23FFB224'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/835a2ccfff.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0A0B0D; --panel:#0F1114; --panel2:#14171C;
  --line:#22262E; --text:#E9E6DF; --muted:#8E929B;
  --accent:#FFB224; --accent-ink:#1A1206;
  --max:1180px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1{font-family:'Archivo',sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:50;background:rgba(10,11,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:14px;height:60px}
.mark{width:30px;height:30px;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:13px;font-weight:600;flex:none}
.brand{font-family:'Archivo',sans-serif;font-weight:800;font-size:1.1rem;color:var(--text)}
a.brand:hover{text-decoration:none}
.badge{font-size:11px;color:var(--accent);border:1px solid rgba(255,178,36,.4);padding:1px 8px;white-space:nowrap;letter-spacing:.1em}
.links{margin-left:auto;display:flex;gap:24px;font-size:12px;letter-spacing:.12em}
.links a{color:var(--muted);text-transform:uppercase}
.links a:hover{color:var(--accent);text-decoration:none}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);padding:6px 10px;cursor:pointer}
.page-head{padding:48px 0 26px}
.page-head h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-.015em;text-transform:uppercase;margin:16px 0 8px}
.page-head h1 .amp{color:var(--accent)}
.page-head p{color:var(--muted);font-size:13.5px}
.micro{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.micro b{color:var(--accent);font-weight:600}
.shell{display:grid;grid-template-columns:300px 1fr;gap:0;border:1px solid var(--line);margin-bottom:70px;align-items:start}
.tree{padding:14px;max-height:70vh;overflow:auto;font-size:13px;border-right:1px solid var(--line)}
.tnode{user-select:none}
.trow{display:flex;align-items:center;gap:9px;padding:5px 9px;cursor:pointer;color:#C9C6BD;white-space:nowrap;border-left:2px solid transparent}
.trow:hover{background:var(--panel)}
.trow.sel{border-left-color:var(--accent);color:var(--accent);background:var(--panel)}
.trow i{width:16px;text-align:center;color:var(--muted);flex:none;font-size:12px}
.trow.sel i{color:var(--accent)}
.tkids{margin-left:16px;border-left:1px solid var(--line);padding-left:4px}
.viewer{min-width:0;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;flex-wrap:wrap}
.vbar .path{color:var(--muted);word-break:break-all}
.vbar .path b{color:var(--text);font-weight:500}
.vbtns{margin-left:auto;display:flex;gap:8px}
.vbtn{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:4px 12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
.vbtn:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.codewrap{display:flex;max-height:70vh;overflow:auto}
.gutter{flex:none;text-align:right;padding:16px 12px 16px 18px;color:#4B5158;font-size:12.5px;line-height:1.7;user-select:none;border-right:1px solid var(--line);background:#0C0D10;white-space:pre}
.codebody{padding:16px 20px;font-size:12.5px;line-height:1.7;white-space:pre;color:#C9C6BD;flex:1}
.status{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.status i{font-size:22px;color:var(--accent);margin-bottom:12px;display:block}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
footer .sp{margin-left:auto;display:flex;gap:20px}
footer a{color:var(--muted)}
footer a:hover{color:var(--accent);text-decoration:none}
.socials{display:flex;gap:15px;font-size:15px}
.socials a{color:var(--muted)}
.socials a:hover{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.modal[hidden]{display:none}
.modal-box{background:var(--panel);border:1px solid var(--line);max-width:760px;width:100%;max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.modal-bar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px}
.modal-bar .t{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.modal pre{padding:20px;font-size:13px;line-height:1.7;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#C9C6BD}
.mbtn{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:4px 12px;cursor:pointer;font-family:inherit}
a.mbtn:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
button.mbtn:hover{color:var(--accent);border-color:var(--accent)}
@media(max-width:820px){.shell{grid-template-columns:1fr}.tree{max-height:300px;border-right:none;border-bottom:1px solid var(--line)}}
@media(max-width:640px){
.links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--panel);flex-direction:column;padding:14px 24px 20px;gap:14px;border-bottom:1px solid var(--line)}
.links.open{display:flex}.burger{display:block}
}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <span class="mark">&gt;_</span>
    <a class="brand" href="index.html">NaOS</a>
    <span class="badge">SOURCE</span>
    <div class="links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="versions/">Versions</a>
      <a href="https://github.com/nacer0s/NaOS">GitHub</a>
    </div>
    <button class="burger" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</nav>

<div class="wrap page-head">
  <div class="micro"><b>FS.READ/01</b> — live from the GitHub API</div>
  <h1>Browse the source<span class="amp">.</span></h1>
  <p>Every file of <code>nacer0s/NaOS @ main</code> — no clone, no toolchain.</p>
</div>

<div class="wrap shell">
  <div class="tree" id="tree" aria-label="File tree"></div>
  <div class="viewer">
    <div class="vbar">
      <span class="path" id="crumb">—</span>
      <span class="vbtns">
        <button class="vbtn" id="copyBtn"><i class="fa-regular fa-copy"></i>copy</button>
        <a class="vbtn" id="ghBtn" href="https://github.com/nacer0s/NaOS" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i>GitHub</a>
      </span>
    </div>
    <div id="stage"><div class="status"><i class="fa-solid fa-circle-notch fa-spin"></i>loading file tree…</div></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span>NaOS — from scratch, in C · <span id="year"></span></span>
    <span class="socials">
      <a href="https://github.com/nacer0s" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="https://nacer0s.com" aria-label="Website"><i class="fa-solid fa-globe"></i></a>
      <a href="https://x.com/nacer0s" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="https://instagram.com/nacer0s" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://tiktok.com/@nacer0s" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
      <a href="https://t.me/nacer0s" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
    </span>
    <span class="sp"><a href="index.html">Home</a><a href="LICENCE.md" data-raw="https://raw.githubusercontent.com/nacer0s/NaOS/main/LICENCE.md" data-gh="https://github.com/nacer0s/NaOS/blob/main/LICENCE.md" data-title="LICENCE.md">Licence</a></span>
  </div>
</footer>

<div class="modal" id="docModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-label="File preview">
    <div class="modal-bar"><span class="t" id="docTitle"></span>
      <span class="sp"><button class="mbtn" id="docCopy">copy</button><a class="mbtn" id="docGh" href="#">GitHub</a><button class="mbtn" id="docClose">close</button></span>
    </div>
    <pre id="docBody">loading…</pre>
  </div>
</div>

<script>
(function(){
  "use strict";
  document.getElementById('year').textContent = new Date().getFullYear();
  var b = document.getElementById('burger'), l = document.getElementById('navLinks');
  b.addEventListener('click', function(){ l.classList.toggle('open'); });

  var API = 'https://api.github.com/repos/nacer0s/NaOS/contents';
  var REF = 'main';
  var MAX_BYTES = 300000;
  var BIN = /\.(png|jpe?g|gif|ico|fd|img|iso|elf|efi|o|woff2?|ttf|eot)$/i;

  var tree = document.getElementById('tree');
  var stage = document.getElementById('stage');
  var crumb = document.getElementById('crumb');
  var ghBtn = document.getElementById('ghBtn');
  var copyBtn = document.getElementById('copyBtn');
  var currentText = '';
  var cache = {};

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }
  function status(icon, msg){
    stage.textContent = '';
    var d = el('div', 'status');
    d.appendChild(el('i', icon));
    d.appendChild(el('div', '', msg));
    stage.appendChild(d);
  }
  function api(path){
    var u = API + (path ? '/' + path.split('/').map(encodeURIComponent).join('/') : '') + '?ref=' + REF;
    return fetch(u, {headers:{'Accept':'application/vnd.github+json'}}).then(function(r){
      if(!r.ok) throw new Error('GitHub API ' + r.status);
      return r.json();
    });
  }
  function sorted(items){
    return items.slice().sort(function(a, b){
      if(a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name < b.name ? -1 : 1;
    });
  }
  function select(path, row){
    tree.querySelectorAll('.trow.sel').forEach(function(x){ x.classList.remove('sel'); });
    if(row) row.classList.add('sel');
    openFile(path);
  }
  function dirNode(item){
    var wrap = el('div', 'tnode');
    var row = el('div', 'trow');
    var ic = el('i', 'fa-solid fa-chevron-right');
    row.appendChild(ic);
    row.appendChild(el('i', 'fa-solid fa-folder'));
    row.appendChild(el('span', '', item.name));
    var kids = el('div', 'tkids');
    kids.style.display = 'none';
    var loaded = false;
    row.addEventListener('click', function(){
      var open = kids.style.display !== 'none';
      if(open){ kids.style.display = 'none'; ic.className = 'fa-solid fa-chevron-right'; return; }
      ic.className = 'fa-solid fa-chevron-down';
      kids.style.display = '';
      if(loaded) return;
      loaded = true;
      kids.appendChild(loadingRow());
      api(item.path).then(function(items){
        cache[item.path] = items;
        kids.textContent = '';
        sorted(items).forEach(function(ch){
          kids.appendChild(ch.type === 'dir' ? dirNode(ch) : fileNode(ch));
        });
        if(!items.length) kids.appendChild(emptyRow());
      }).catch(function(){ kids.textContent = ''; kids.appendChild(errRow()); loaded = false; });
    });
    wrap.appendChild(row);
    wrap.appendChild(kids);
    return wrap;
  }
  function fileNode(item){
    var row = el('div', 'trow');
    row.appendChild(el('i', item.name.slice(-3) === '.md' ? 'fa-brands fa-markdown' : 'fa-regular fa-file-code'));
    row.appendChild(el('span', '', item.name));
    row.title = item.path;
    row.addEventListener('click', function(){ select(item.path, row); });
    return row;
  }
  function loadingRow(){ var r = el('div','trow'); r.appendChild(el('i','fa-solid fa-circle-notch fa-spin')); r.appendChild(el('span','','loading…')); return r; }
  function emptyRow(){ var r = el('div','trow'); r.appendChild(el('span','','(empty)')); return r; }
  function errRow(){ var r = el('div','trow'); r.appendChild(el('i','fa-solid fa-triangle-exclamation')); r.appendChild(el('span','','failed to load')); return r; }

  function openFile(path){
    crumb.textContent = '';
    crumb.appendChild(el('b', '', path));
    ghBtn.href = 'https://github.com/nacer0s/NaOS/blob/main/' + path;
    currentText = '';
    if(BIN.test(path)){
      status('fa-solid fa-file', 'Binary file — view or download it on GitHub.');
      return;
    }
    status('fa-solid fa-circle-notch fa-spin', 'loading ' + path + ' …');
    var parts = path.split('/');
    var parent = parts.slice(0, -1).join('/');
    function load(url, size){
      if(size > MAX_BYTES){ status('fa-solid fa-file', 'File is too big to preview (' + size + ' bytes) — open it on GitHub.'); return; }
      fetch(url).then(function(r){
        if(!r.ok) throw new Error('fetch ' + r.status);
        return r.text();
      }).then(function(t){ render(t); }).catch(function(){ status('fa-solid fa-triangle-exclamation', 'Could not load this file. Check your connection or open it on GitHub.'); });
    }
    function fromList(items){
      for(var i = 0; i < items.length; i++){
        if(items[i].path === path){ load(items[i].download_url, items[i].size || 0); return; }
      }
      status('fa-solid fa-triangle-exclamation', 'File not found in this folder.');
    }
    if(cache[parent]) fromList(cache[parent]);
    else api(parent).then(function(items){ cache[parent] = items; fromList(items); })
      .catch(function(){ status('fa-solid fa-triangle-exclamation', 'Could not load this file. Check your connection or open it on GitHub.'); });
  }
  function render(text){
    currentText = text;
    stage.textContent = '';
    var wrap = el('div', 'codewrap');
    var gut = el('div', 'gutter');
    var pre = el('pre', 'codebody');
    var lines = text.split('\n');
    if(lines.length > 5000){ pre.textContent = text; gut.textContent = '…'; }
    else {
      var g = '';
      for(var i = 1; i <= lines.length; i++) g += i + '\n';
      gut.textContent = g;
      pre.textContent = text;
    }
    if(!gut.textContent) gut.textContent = '1';
    wrap.appendChild(gut);
    wrap.appendChild(pre);
    stage.appendChild(wrap);
  }
  copyBtn.addEventListener('click', function(){
    if(!currentText || !navigator.clipboard) return;
    navigator.clipboard.writeText(currentText).then(function(){
      copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>copied';
      setTimeout(function(){ copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>copy'; }, 1500);
    });
  });

  api('').then(function(items){
    cache[''] = items;
    tree.textContent = '';
    sorted(items).forEach(function(it){
      tree.appendChild(it.type === 'dir' ? dirNode(it) : fileNode(it));
    });
    openFile('README.md');
    var rows = tree.querySelectorAll('.trow');
    for(var i = 0; i < rows.length; i++){
      if(rows[i].title === 'README.md'){ rows[i].classList.add('sel'); break; }
    }
  }).catch(function(){
    tree.textContent = '';
    var d = el('div', 'status');
    d.appendChild(el('i', 'fa-solid fa-triangle-exclamation'));
    d.appendChild(el('div', '', 'GitHub API unreachable (offline or rate-limited). Try again later or visit github.com/nacer0s/NaOS.'));
    tree.appendChild(d);
    status('fa-solid fa-wifi', 'Nothing to show without a connection.');
  });

  var m = document.getElementById('docModal');
  var title = document.getElementById('docTitle');
  var dbody = document.getElementById('docBody');
  var dgh = document.getElementById('docGh');
  var dcopy = document.getElementById('docCopy');
  var dcurrent = '';
  function close(){ m.hidden = true; }
  document.getElementById('docClose').addEventListener('click', close);
  m.addEventListener('click', function(e){ if(e.target === m) close(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  dcopy.addEventListener('click', function(){
    if(!dcurrent || !navigator.clipboard) return;
    navigator.clipboard.writeText(dcurrent).then(function(){
      dcopy.textContent = 'copied';
      setTimeout(function(){ dcopy.textContent = 'copy'; }, 1500);
    });
  });
  document.querySelectorAll('a[data-raw]').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      title.textContent = a.getAttribute('data-title') || 'file';
      dgh.href = a.getAttribute('data-gh') || a.href;
      dbody.textContent = 'loading…';
      dcurrent = '';
      m.hidden = false;
      fetch(a.getAttribute('data-raw')).then(function(r){
        if(!r.ok) throw 0;
        return r.text();
      }).then(function(t){
        if(t.length > 200000) t = t.slice(0, 200000) + '\n…(truncated)';
        dcurrent = t;
        dbody.textContent = t;
      }).catch(function(){
        dbody.textContent = 'Could not load (offline?). Open on GitHub instead.';
      });
    });
  });
})();
</script>
</body>
</html>
