<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse code — NaOS</title>
<meta name="description" content="Read the NaOS source in your browser. No download, no install.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0d'/%3E%3Ctext x='6' y='23' font-family='monospace' font-size='16' fill='%234ade80'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/835a2ccfff.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0b0b0d; --panel:#121316; --panel2:#17181c;
  --line:#23262c; --text:#e9eaee; --muted:#9aa0aa;
  --accent:#4ade80; --accent-ink:#052e14;
  --radius:14px; --max:1180px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono,code,pre{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:50;background:rgba(11,11,13,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--text)}
.brand i{color:var(--accent)}
.badge{font-size:.68rem;font-weight:600;background:rgba(74,222,128,.12);color:var(--accent);border:1px solid rgba(74,222,128,.35);border-radius:999px;padding:2px 10px;white-space:nowrap}
.links{margin-left:auto;display:flex;gap:22px;font-size:.92rem}
.links a{color:var(--muted)}
.links a:hover{color:var(--text);text-decoration:none}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 11px;cursor:pointer}
.page-head{padding:46px 0 24px}
.page-head h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.page-head h1 i{color:var(--accent);margin-right:12px}
.page-head p{color:var(--muted);font-size:.95rem}
.shell{display:grid;grid-template-columns:300px 1fr;gap:18px;padding-bottom:70px;align-items:start}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;max-height:70vh;overflow:auto;font-size:.85rem}
.tnode{user-select:none}
.trow{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;cursor:pointer;color:#c9cdd4;white-space:nowrap}
.trow:hover{background:var(--panel2)}
.trow.sel{background:rgba(74,222,128,.1);color:var(--accent)}
.trow i{width:16px;text-align:center;color:var(--muted);flex:none}
.trow.sel i{color:var(--accent)}
.tkids{margin-left:18px;border-left:1px solid var(--line);padding-left:6px}
.viewer{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}
.vbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.vbar .path{font-size:.82rem;color:var(--muted);word-break:break-all}
.vbar .path b{color:var(--text)}
.vbtns{margin-left:auto;display:flex;gap:8px}
.vbtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:.75rem;padding:5px 12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
.vbtn:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.codewrap{display:flex;max-height:70vh;overflow:auto}
.gutter{flex:none;text-align:right;padding:16px 12px 16px 18px;color:#4b5158;font-size:.8rem;line-height:1.7;user-select:none;border-right:1px solid var(--line);background:#0d0e11;white-space:pre}
.codebody{padding:16px 20px;font-size:.8rem;line-height:1.7;white-space:pre;color:#c9cdd4;flex:1}
.status{padding:40px 20px;text-align:center;color:var(--muted);font-size:.9rem}
.status i{font-size:1.6rem;color:var(--accent);margin-bottom:12px;display:block}
footer{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
footer .sp{margin-left:auto;display:flex;gap:20px}
.socials{display:flex;gap:16px;font-size:1.05rem}
.socials a{color:var(--muted)}
.socials a:hover{color:var(--accent);text-decoration:none}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .tree{max-height:300px}
  .links{display:none;position:absolute;top:62px;left:0;right:0;background:var(--panel);flex-direction:column;padding:14px 24px 20px;gap:14px;border-bottom:1px solid var(--line)}
  .links.open{display:flex}
  .burger{display:block}
}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="index.html" style="text-decoration:none"><i class="fa-solid fa-terminal"></i>NaOS</a>
    <span class="badge">code viewer</span>
    <div class="links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="versions/">Versions</a>
      <a href="https://github.com/nacer0s/NaOS">GitHub</a>
    </div>
    <button class="burger" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</nav>

<div class="wrap page-head">
  <h1><i class="fa-solid fa-folder-open"></i>Browse the source</h1>
  <p>Read every file of <span class="mono">nacer0s/NaOS @ main</span> right here — no clone, no toolchain. Live from the GitHub API.</p>
</div>

<div class="wrap shell">
  <div class="tree" id="tree" aria-label="File tree"></div>
  <div class="viewer">
    <div class="vbar">
      <span class="path mono" id="crumb">—</span>
      <span class="vbtns">
        <button class="vbtn" id="copyBtn"><i class="fa-regular fa-copy"></i>copy</button>
        <a class="vbtn" id="ghBtn" href="https://github.com/nacer0s/NaOS" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i>GitHub</a>
      </span>
    </div>
    <div id="stage"><div class="status"><i class="fa-solid fa-circle-notch fa-spin"></i>loading file tree…</div></div>
  </div>
</div>

<footer>
  <div class="wrap">
    <span><i class="fa-solid fa-terminal"></i>&nbsp; NaOS — from scratch, in C · <span id="year"></span></span>
    <span class="socials">
      <a href="https://github.com/nacer0s" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="https://nacer0s.com" aria-label="Website"><i class="fa-solid fa-globe"></i></a>
      <a href="https://x.com/nacer0s" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="https://instagram.com/nacer0s" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://tiktok.com/@nacer0s" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
      <a href="https://t.me/nacer0s" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
    </span>
    <span class="sp"><a href="index.html">Home</a><a href="LICENCE.md">Licence</a></span>
  </div>
</footer>

<script>
(function(){
  "use strict";
  document.getElementById('year').textContent = new Date().getFullYear();
  var b = document.getElementById('burger'), l = document.getElementById('navLinks');
  b.addEventListener('click', function(){ l.classList.toggle('open'); });

  var API = 'https://api.github.com/repos/nacer0s/NaOS/contents';
  var REF = 'main';
  var MAX_BYTES = 300000;
  var BIN = /\.(png|jpe?g|gif|ico|fd|img|iso|elf|efi|o|woff2?|ttf|eot)$/i;

  var tree = document.getElementById('tree');
  var stage = document.getElementById('stage');
  var crumb = document.getElementById('crumb');
  var ghBtn = document.getElementById('ghBtn');
  var copyBtn = document.getElementById('copyBtn');
  var currentText = '';
  var cache = {};

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }
  function status(icon, msg){
    stage.textContent = '';
    var d = el('div', 'status');
    var i = el('i', icon);
    d.appendChild(i);
    d.appendChild(el('div', '', msg));
    stage.appendChild(d);
  }
  function api(path){
    var u = API + (path ? '/' + path.split('/').map(encodeURIComponent).join('/') : '') + '?ref=' + REF;
    return fetch(u, {headers:{'Accept':'application/vnd.github+json'}}).then(function(r){
      if(!r.ok) throw new Error('GitHub API ' + r.status);
      return r.json();
    });
  }
  function sorted(items){
    return items.slice().sort(function(a, b){
      if(a.type !== b.type) return a.type === 'dir' ? -1 : 1;
      return a.name < b.name ? -1 : 1;
    });
  }
  function select(path, row){
    tree.querySelectorAll('.trow.sel').forEach(function(x){ x.classList.remove('sel'); });
    if(row) row.classList.add('sel');
    openFile(path);
  }
  function dirNode(item, depth){
    var wrap = el('div', 'tnode');
    var row = el('div', 'trow');
    var ic = el('i', 'fa-solid fa-chevron-right');
    row.appendChild(ic);
    var fi = el('i', 'fa-solid fa-folder');
    row.appendChild(fi);
    row.appendChild(el('span', '', item.name));
    var kids = el('div', 'tkids');
    kids.style.display = 'none';
    var loaded = false;
    row.addEventListener('click', function(){
      var open = kids.style.display !== 'none';
      if(open){ kids.style.display = 'none'; ic.className = 'fa-solid fa-chevron-right'; return; }
      ic.className = 'fa-solid fa-chevron-down';
      kids.style.display = '';
      if(loaded) return;
      loaded = true;
      kids.appendChild(loadingRow());
      api(item.path).then(function(items){
        cache[item.path] = items;
        kids.textContent = '';
        sorted(items).forEach(function(ch){
          kids.appendChild(ch.type === 'dir' ? dirNode(ch) : fileNode(ch));
        });
        if(!items.length) kids.appendChild(emptyRow());
      }).catch(function(){ kids.textContent = ''; kids.appendChild(errRow()); loaded = false; });
    });
    wrap.appendChild(row);
    wrap.appendChild(kids);
    return wrap;
  }
  function fileNode(item){
    var row = el('div', 'trow');
    var ic = el('i', item.name.slice(-3) === '.md' ? 'fa-brands fa-markdown' : 'fa-regular fa-file-code');
    row.appendChild(ic);
    row.appendChild(el('span', 'mono', item.name));
    row.title = item.path;
    row.addEventListener('click', function(){ select(item.path, row); });
    return row;
  }
  function loadingRow(){ var r = el('div','trow'); r.appendChild(el('i','fa-solid fa-circle-notch fa-spin')); r.appendChild(el('span','','loading…')); return r; }
  function emptyRow(){ var r = el('div','trow'); r.appendChild(el('span','','(empty)')); return r; }
  function errRow(){ var r = el('div','trow'); r.appendChild(el('i','fa-solid fa-triangle-exclamation')); r.appendChild(el('span','','failed to load')); return r; }

  function openFile(path){
    crumb.textContent = '';
    crumb.appendChild(el('b', '', path));
    ghBtn.href = 'https://github.com/nacer0s/NaOS/blob/main/' + path;
    currentText = '';
    if(BIN.test(path)){
      status('fa-solid fa-file', 'Binary file — view or download it on GitHub.');
      return;
    }
    status('fa-solid fa-circle-notch fa-spin', 'loading ' + path + ' …');
    /* find size/download url: walk cache, else list parent */
    function load(url, size){
      if(size > MAX_BYTES){ status('fa-solid fa-file', 'File is too big to preview (' + size + ' bytes) — open it on GitHub.'); return; }
      fetch(url).then(function(r){
        if(!r.ok) throw new Error('fetch ' + r.status);
        return r.text();
      }).then(function(t){ render(t); }).catch(function(){ status('fa-solid fa-triangle-exclamation', 'Could not load this file. Check your connection or open it on GitHub.'); });
    }
    var parts = path.split('/');
    var parent = parts.slice(0, -1).join('/');
    function fromList(items){
      for(var i = 0; i < items.length; i++){
        if(items[i].path === path){ load(items[i].download_url, items[i].size || 0); return; }
      }
      status('fa-solid fa-triangle-exclamation', 'File not found in this folder.');
    }
    if(cache[parent]) fromList(cache[parent]);
    else api(parent).then(function(items){ cache[parent] = items; fromList(items); })
      .catch(function(){ status('fa-solid fa-triangle-exclamation', 'Could not load this file. Check your connection or open it on GitHub.'); });
  }
  function render(text){
    currentText = text;
    stage.textContent = '';
    var wrap = el('div', 'codewrap');
    var gut = el('div', 'gutter mono');
    var pre = el('pre', 'codebody');
    var lines = text.split('\n');
    if(lines.length > 5000){ pre.textContent = text; }
    else {
      var g = '';
      for(var i = 1; i <= lines.length; i++) g += i + '\n';
      gut.textContent = g;
      pre.textContent = text;
    }
    if(!gut.textContent) gut.textContent = '1';
    wrap.appendChild(gut);
    wrap.appendChild(pre);
    stage.appendChild(wrap);
  }
  copyBtn.addEventListener('click', function(){
    if(!currentText || !navigator.clipboard) return;
    navigator.clipboard.writeText(currentText).then(function(){
      copyBtn.innerHTML = '<i class="fa-solid fa-check"></i>copied';
      setTimeout(function(){ copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>copy'; }, 1500);
    });
  });

  /* boot: root tree + README */
  api('').then(function(items){
    cache[''] = items;
    tree.textContent = '';
    sorted(items).forEach(function(it){
      tree.appendChild(it.type === 'dir' ? dirNode(it) : fileNode(it));
    });
    openFile('README.md');
    /* highlight README row once rendered */
    var rows = tree.querySelectorAll('.trow');
    for(var i = 0; i < rows.length; i++){
      if(rows[i].title === 'README.md'){ rows[i].classList.add('sel'); break; }
    }
  }).catch(function(){
    tree.textContent = '';
    var d = el('div', 'status');
    d.appendChild(el('i', 'fa-solid fa-triangle-exclamation'));
    d.appendChild(el('div', '', 'GitHub API unreachable (offline or rate-limited). Try again later or visit github.com/nacer0s/NaOS.'));
    tree.appendChild(d);
    status('fa-solid fa-wifi', 'Nothing to show without a connection.');
  });
})();
</script>
</body>
</html>
