# Dependabot: intentionally disabled.
#
# NaOS has no supported package ecosystem: the OS is freestanding C + Make
# (cross-compiler in /opt/cross, no vendored deps), tools use Python stdlib
# only, and the website is vanilla HTML/CSS/JS with no npm packages.
# There is nothing for Dependabot to update, so there is no `updates:` block.
# If a package manifest ever lands (e.g. .github/workflows/*.yml for
# Actions, package.json, requirements.txt), re-enable with e.g.:
#
# version: 2
# updates:
#   - package-ecosystem: "github-actions"
#     directory: "/"
#     schedule:
#       interval: "weekly"

version: 2
